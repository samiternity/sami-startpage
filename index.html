<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z'/%3E%3Cpolyline points='9 22 9 12 15 12 15 22'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/main.css">

<body>
  <main class="startpage-root">
    <div id="grid" class="grid-container" role="grid" aria-label="Shortcuts"></div>
  </main>

  <!-- Bottom-right theme toolbar -->
  <aside class="toolbar" id="toolbar">
    <div class="theme-menu" id="themeMenu" aria-hidden="true" role="menu">
      <div class="theme-menu-title">COLOR THEMES</div>
      <div class="theme-options" id="themeOptions"></div>
    </div>
    <button class="toolbar-btn" id="themeBtn" aria-label="Color themes" title="Color Themes" aria-expanded="false">
      <span class="theme-btn-dot" id="themeDot"></span>
      <svg class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor"/>
        <circle cx="12" cy="7.5" r="1.5" fill="currentColor"/>
        <circle cx="16.5" cy="10.5" r="1.5" fill="currentColor"/>
      </svg>
    </button>
  </aside>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
